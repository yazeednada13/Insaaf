name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify documentation structure
        run: |
          test -f docs/architecture.md
          test -f docs/product-spec.md
          test -f docs/implementation-plan.md
          test -f docs/project-progress.md
          test -f docs/decisions.md
          test -f docs/local-development.md
          test -f docs/figma/README.md

  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    needs: foundation
    if: hashFiles('src/backend/**/*.csproj') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore and build
        run: dotnet build src/backend/Insaaf.sln --configuration Release
      - name: Test
        run: dotnet test src/backend/Insaaf.sln --configuration Release --no-build
      # Report only (Phase 10): lists known vulnerable packages without failing the build.
      - name: Vulnerable packages (report)
        continue-on-error: true
        run: dotnet list src/backend/Insaaf.sln package --vulnerable --include-transitive

  mobile:
    name: Mobile lint and typecheck
    runs-on: ubuntu-latest
    needs: foundation
    if: hashFiles('src/mobile/package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/mobile/package-lock.json
      - name: Install dependencies
        working-directory: src/mobile
        run: npm ci
      - name: Lint
        working-directory: src/mobile
        run: npm run lint --if-present
      - name: Typecheck
        working-directory: src/mobile
        run: npm run typecheck --if-present
      # Phase 10: the JavaScript bundle must build for both platforms (no native build, no upload).
      - name: Bundle (Android and iOS)
        working-directory: src/mobile
        run: |
          npx expo export --platform android --output-dir "$RUNNER_TEMP/export-android"
          npx expo export --platform ios --output-dir "$RUNNER_TEMP/export-ios"
      # Report only: runtime dependency advisories at critical level, without failing the build.
      - name: npm audit (report)
        continue-on-error: true
        working-directory: src/mobile
        run: npm audit --omit=dev --audit-level=critical
